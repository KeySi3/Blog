services:
  # Контейнер СУБД MongoDB
  mongo:
    image: mongo:7.0
    container_name: blog_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Контейнер основного блога
  blog_service:
    build:
      context: ./blog_service
    container_name: blog_fastapi
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=blog_db
    volumes:
      - ./blog_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongo

  # Контейнер сервиса отчетов
  reporting_service:
    build:
      context: ./reporting_service
    container_name: reporting_fastapi
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=blog_db
    volumes:
      - ./reporting_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - mongo

volumes:
  mongo_data:
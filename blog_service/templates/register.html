<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация в блоге</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #1f2937;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #4b5563;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .success {
            background-color: #dcfce7;
            color: #166534;
        }
        .error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Регистрация</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" required minlength="3">
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" required minlength="6">
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div id="statusMessage" class="message"></div>
    <div class="footer-link" style="margin-top: 20px; text-align: center; font-size: 14px; color: #4b5563;">
    Уже есть аккаунт? <a href="/login" style="color: #2563eb; text-decoration: none; font-weight: 500;">Войти</a>
</div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const msgBox = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                // Сохраняем имя и пароль для действий в блоге
                localStorage.setItem('blog_user', JSON.stringify({
                    username: payload.username,
                    password: payload.password
                }));
                window.location.href = '/'; // переход на главную
            } else {
                msgBox.className = 'message error';
                msgBox.textContent = data.detail || 'Ошибка регистрации';
                msgBox.style.display = 'block';
            }
        } catch (err) {
            msgBox.className = 'message error';
            msgBox.textContent = 'Ошибка сети при отправке запроса';
            msgBox.style.display = 'block';
        }
    });
</script>

</body>
</html>
